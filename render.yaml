services:
  - type: web
    name: car-rental-klbc
    env: docker
    plan: free
    branch: main
    buildCommand: "composer install && php artisan config:clear"
    startCommand: "php artisan serve --host=0.0.0.0 --port=8000"
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_KEY
        value: base64:4RZpTDKH7C4MortYrEqaHmSN5RQ1EVFIHOdFU4D6AvI=
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        value: your-db-host
      - key: DB_PORT
        value: 3306
      - key: DB_DATABASE
        value: your-db-name
      - key: DB_USERNAME
        value: your-db-user
      - key: DB_PASSWORD
        value: 36329720
